name: harness check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdc'
      - '.cursor/**'
      - '.claude/**'
      - 'scripts/harness/**'
      - '.github/workflows/harness-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdc'
      - '.cursor/**'
      - '.claude/**'
      - 'scripts/harness/**'
      - '.github/workflows/harness-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harness check
        run: bash scripts/harness/check.sh
