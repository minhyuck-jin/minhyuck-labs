name: labs-api test

on:
  push:
    branches: [main]
    paths:
      - 'backend/java/labs-api/**'
      - '.github/workflows/labs-api-test.yml'
  pull_request:
    paths:
      - 'backend/java/labs-api/**'
      - '.github/workflows/labs-api-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java/labs-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Gradle test
        run: ./gradlew test --no-daemon
