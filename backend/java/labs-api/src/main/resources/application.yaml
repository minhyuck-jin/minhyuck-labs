spring:
  application:
    name: labs-api
  datasource:
    url: ${LABS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/labs_api}
    username: ${LABS_DATASOURCE_USERNAME:labs}
    password: ${LABS_DATASOURCE_PASSWORD:labs}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath*:com/minhyuck/labs/**/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  show-actuator: false
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.minhyuck.labs: DEBUG

management:
  endpoint:
    metrics:
      access: read-only
    prometheus:
      access: read-only
    health:
      probes:
        enabled: true
      show-details: never
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator
  prometheus:
    metrics:
      export:
        enabled: true
